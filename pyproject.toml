[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-jianying-draft-builder"
version = "0.3.0"
description = "将单集或批量 AI 视频素材按文件名顺序生成剪映草稿"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyJianYingDraft==0.3.0",
]

[project.scripts]
ai-jianying-draft-builder = "ai_draft_builder.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

